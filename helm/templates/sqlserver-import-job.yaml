# Job for one-time SQL import
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.app.name }}-sql-import-job"
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      dependencies:
        - "job/{{ .Values.app.name }}-sql-import-job"
      containers:
      - name: sql-import
        image: mariadb:10.5 # Your MySQL version here
        env:
        - name: DATABASE
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.app.name }}-db-creds"
              key: database
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.app.name }}-db-creds"
              key: username
        - name: DATABASE_PASS
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.app.name }}-db-creds"
              key: password
        command:
          - sh
          - -c
          - |
            mysql \
              -h {{ .Values.app.name }}-sql-lb.{{ .Values.namespace }}.svc.cluster.local \
              -u "$DATABASE_USER" \
              -p"$DATABASE_PASS" \
              "$DATABASE" < /sql/import.sql
        volumeMounts:
        - name: sql-files
          mountPath: /sql
      restartPolicy: OnFailure
      volumes:
      - name: sql-files
        configMap:
          name: sql-configmap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-configmap
  namespace: {{ .Values.namespace }}
data:
  import.sql: |
    DROP TABLE IF EXISTS transactions;

    CREATE TABLE transactions (
      id int PRIMARY KEY AUTO_INCREMENT,
      date DATE NOT NULL,
      amount INT
    );